    } else if(t.type === 'sw'){
      if(!t.started){ t.started = Date.now(); }
    } else if(t.type === 'calc'){
      t.canceled = false; t.done = false; t.paused = false; t.pausedRemaining = 0; t.firstRunDone = false; t.whenSatisfied = true;
      t.nextAt = Date.now() + (t.initialDelay !== undefined ? t.initialDelay : t.duration);
    } else if(t.type === 'rem'){
      t.canceled = false; t.fired = false; t.when = Date.now() + 1000;
    }
  });
  scheduleLineTimerSave();
  return found;
}
function getLineTimer(spec){

  var state = npLineTimers[spec.key];
  if(!state){
    var isDormant = spec.type === 'calc' && spec.manual;
    var firstNextAt = (spec.type === 'calc' && !isDormant)
      ? (spec.when || (Date.now() + (spec.initialDelay !== undefined ? spec.initialDelay : spec.duration)))
      : 0;
    state = npLineTimers[spec.key] = { type:spec.type, duration:spec.duration, initialDelay:spec.initialDelay, when:spec.when, note:spec.note, mode:spec.mode, expr:spec.expr, label:spec.label || '', thenStart:spec.thenStart || '', manual:!!spec.manual, whenExpr:spec.whenExpr || '', whenSatisfied:false, elapsed:0, started:0, endAt:0, canceled:isDormant, fired:false, nextAt:firstNextAt, lastResult:'', done:false, paused:false, pausedRemaining:0, firstRunDone:false };
  }
  return state;
}
function lineTimerMarkup(rawLine, index){
  var spec = parseLineTimer(rawLine, index);
  if(!spec){ return ''; }
  if(npLineTimerSeenKeys){ npLineTimerSeenKeys[spec.key] = true; }
  var state = getLineTimer(spec), key = escapeHtml(spec.key);
  var labelHtml = spec.label ? ('<span class="np-line-timer-label">' + escapeHtml(spec.label) + '</span>') : '';
  if(spec.thenStart){ labelHtml += '<span class="np-line-timer-note">\u2192 ' + escapeHtml(spec.thenStart) + '</span>'; }
  if(spec.type === 'sw'){
    var elapsed = state.elapsed + (state.started ? Date.now() - state.started : 0);
    return '<span class="np-line-timer">' + labelHtml + '<span class="np-line-timer-display">' + formatHMSMillis(elapsed) + '</span><button class="' + (state.started ? 'running' : '') + '" data-line-timer-action="sw-toggle" data-line-timer-key="' + key + '">' + (state.started ? 'Pause' : 'Start') + '</button><button data-line-timer-action="sw-reset" data-line-timer-key="' + key + '">Reset</button></span>';
  }
  if(spec.type === 'cd'){
    var remaining = state.endAt ? Math.max(0, state.endAt - Date.now()) : (state.remaining || state.duration);
    var cdNote = (spec.expr && state.lastResult) ? ('<span class="np-line-timer-note" title="' + escapeHtml(spec.expr) + '">' + escapeHtml(state.lastResult) + '</span>') : '';
    return '<span class="np-line-timer">' + labelHtml + '<span class="np-line-timer-display">' + formatHMS(remaining / 1000) + '</span>' + cdNote + '<button class="' + (state.endAt ? 'running' : '') + '" data-line-timer-action="cd-toggle" data-line-timer-key="' + key + '">' + (state.endAt ? 'Pause' : (state.remaining ? 'Resume' : 'Start')) + '</button><button data-line-timer-action="cd-reset" data-line-timer-key="' + key + '">Reset</button></span>';
  }
  if(spec.type === 'calc'){
    var calcLabel;
    if(state.canceled){
      if(state.whenExpr && !state.whenSatisfied){ calcLabel = 'Waiting for condition'; }
      else if(state.manual && !state.firstRunDone && state.lastResult === ''){ calcLabel = 'Waiting' + (state.thenStart ? '' : ' (manual)'); }
      else { calcLabel = 'Cancelled'; }
    }
    else if(state.done){ calcLabel = 'Done'; }
    else if(state.paused){ calcLabel = 'Paused (' + formatHMS(Math.max(0, state.pausedRemaining) / 1000) + ' left)'; }
    else {
      var msLeft = state.nextAt - Date.now();
      calcLabel = 'Next ' + formatReminderTime(state.nextAt) + ' (in ' + (msLeft > 0 ? formatHMS(msLeft / 1000) : '00:00:00') + ')';
    }
    if(state.lastResult){ calcLabel += ' • ' + state.lastResult; }
    return '<span class="np-line-timer">' + labelHtml + '<span class="np-line-timer-note" title="' + escapeHtml(spec.whenExpr ? ('when ' + spec.whenExpr + ' | ' + spec.expr) : spec.expr) + '">' + escapeHtml(calcLabel) + '</span><button data-line-timer-action="calc-run" data-line-timer-key="' + key + '">Run</button>' + (!state.canceled && !state.done ? '<button class="' + (state.paused ? 'running' : '') + '" data-line-timer-action="calc-pause" data-line-timer-key="' + key + '">' + (state.paused ? 'Resume' : 'Pause') + '</button><button data-line-timer-action="calc-cancel" data-line-timer-key="' + key + '">Cancel</button>' : '') + '<button data-line-timer-action="calc-reset" data-line-timer-key="' + key + '">Reset</button></span>';
  }
  var remLabel = state.canceled ? 'Cancelled' : (state.fired ? 'Done' : 'Due ' + formatReminderTime(state.when));
  return '<span class="np-line-timer">' + labelHtml + '<span class="np-line-timer-note">' + escapeHtml(remLabel + (state.note ? ': ' + state.note : '')) + '</span>' + (!state.canceled && !state.fired ? '<button data-line-timer-action="rem-cancel" data-line-timer-key="' + key + '">Cancel</button>' : '') + '</span>';
}
function handleLineTimerAction(action, key){
  var state = npLineTimers[key]; if(!state){ return; }
  if(action === 'sw-toggle'){ if(state.started){ state.elapsed += Date.now() - state.started; state.started = 0; } else { state.started = Date.now(); ensureNotificationPermission(); } }
  else if(action === 'sw-reset'){ state.elapsed = 0; state.started = 0; }
  else if(action === 'cd-toggle'){ if(state.endAt){ state.remaining = Math.max(0, state.endAt - Date.now()); state.endAt = 0; } else { var ms = state.remaining || state.duration; if(ms > 0){ state.endAt = Date.now() + ms; state.remaining = 0; ensureNotificationPermission(); } } }
  else if(action === 'cd-reset'){ state.endAt = 0; state.remaining = 0; state.lastResult = ''; }
  else if(action === 'rem-cancel'){ state.canceled = true; }
  else if(action === 'calc-run'){ runScheduledCalculation(state, key); }
  else if(action === 'calc-pause'){
    if(state.paused){ state.nextAt = Date.now() + state.pausedRemaining; state.pausedRemaining = 0; state.paused = false; }
    else { state.pausedRemaining = Math.max(0, state.nextAt - Date.now()); state.paused = true; }
  }
  else if(action === 'calc-cancel'){ state.canceled = true; }
  else if(action === 'calc-reset'){
    state.done = false; state.paused = false; state.pausedRemaining = 0;
    state.lastResult = ''; state.firstRunDone = false;
    if(state.whenExpr){
      // Re-arm: go back to waiting for the condition rather than running now.
      state.canceled = true; state.whenSatisfied = false;
    } else {
      state.canceled = false;
      state.nextAt = Date.now() + (state.initialDelay !== undefined ? state.initialDelay : state.duration);
    }
  }
  scheduleLineTimerSave();
  renderNotepad();
}
function runTimerExprStatements(exprText){
  // Shared by scheduled calc timers (every/at/after...every) and countdown
  // completion expressions. The expression can hold ANY formula, referencing
  // ANY number of lines in ANY position -- e.g. sum(L1 to L9), or
  // "L2+L4+L7+sqrt(L9)". Multiple outputs are supported by separating
  // statements with ";" -- e.g.  L2 = L2 + L1; L6 = avg(L1 to L5)
  // Each statement is evaluated by appending it as a scratch line AFTER the
  // whole current buffer (so it can see every line, regardless of where the
  // timer line itself sits), then -- if it has a "Ldest = " prefix -- its
  // result is written back into that destination line before the next
  // statement runs, so later statements can chain off earlier ones.
  var statements = exprText.split(/;+/).map(function(s){ return s.trim(); }).filter(Boolean);
  if(!statements.length){ statements = [exprText.trim()]; }
  var currentText = npInput.value.split('\n');
  var summaryParts = [];
  statements.forEach(function(stmt){
    var destination = stmt.match(/^L(\d+)\s*=\s*(.+)$/i);
    var expression = destination ? destination[2] : stmt;
    var scratch = currentText.slice();
    scratch.push(expression);
    var scratchIdx = scratch.length - 1;
    var output = evaluateNotepad(scratch.join('\n')).results[scratchIdx] || '';
    var value = output.replace(/^=\s*/, '');
    if(destination){
      var destinationIndex = parseInt(destination[1], 10) - 1;
      if(destinationIndex >= 0 && destinationIndex < currentText.length && value !== ''){
        currentText[destinationIndex] = value;
        summaryParts.push('L' + destination[1] + ' = ' + value);
      } else {
        summaryParts.push('Cannot write to L' + destination[1] + ' (only ' + currentText.length + ' lines exist)');
      }
    } else {
      summaryParts.push(value !== '' ? value : 'No result');
    }
  });
  npInput.value = currentText.join('\n');
  npScheduleSave();
  return summaryParts.join(', ');
}
function runScheduledCalculation(state, key){
  state.lastResult = state.expr ? runTimerExprStatements(state.expr) : '';
  // For an "after <delay> every <interval>" timer, the FIRST run is the moment
  // the initial wait ends and the recurring cycle begins -- show the same
  // finished-popup a plain countdown would, as the visible/audible signal that
  // the "every <interval>" phase has now started. Subsequent every-interval
  // runs stay silent so a fast interval (e.g. every 1s) doesn't spam alerts.
  if(!state.firstRunDone && state.initialDelay !== undefined){
    showAlarm('Countdown finished', 'Now repeating every ' + formatHMS(state.duration / 1000) + ' \u2014 ' + state.lastResult);
  }
  state.firstRunDone = true;
  if(state.mode === 'every'){ state.nextAt = Date.now() + state.duration; }
  else { state.done = true; if(state.thenStart){ triggerThenStart(state.thenStart); } }
  scheduleLineTimerSave();
}
function evaluateConditionExpr(exprText){
  // Read-only truthy check for a "when" gate condition -- reuses the full
  // expression engine (comparisons, if/then/else, date logic, L# refs to
  // whatever line another timer's output was written to) but never writes
  // anything back, unlike runTimerExprStatements.
  var scratch = npInput.value.split('\n');
  scratch.push(exprText);
  var idx = scratch.length - 1;
  var out = evaluateNotepad(scratch.join('\n')).results[idx] || '';
  var val = parseFloat(out.replace(/^=\s*/, ''));
  return !isNaN(val) && val !== 0;
}
function tickLineTimers(){
  var now = Date.now(), changed = false;
  Object.keys(npLineTimers).forEach(function(key){
    var state = npLineTimers[key];
    if(state.type === 'cd' && state.endAt && state.endAt <= now){
      state.endAt = 0; state.remaining = 0;
      if(state.expr){ state.lastResult = runTimerExprStatements(state.expr); }
      showAlarm('Countdown finished', state.expr ? (state.expr + ' \u2192 ' + state.lastResult) : 'Your line countdown has reached zero.');
      if(state.thenStart){ triggerThenStart(state.thenStart); }
      changed = true;
    }
    if(state.type === 'rem' && !state.canceled && !state.fired && state.when <= now){
      state.fired = true;
      showAlarm('Reminder', state.note || 'Reminder due');
      if(state.thenStart){ triggerThenStart(state.thenStart); }
      changed = true;
    }
    if(state.type === 'calc' && state.whenExpr && state.canceled && !state.whenSatisfied && !state.done){
      if(evaluateConditionExpr(state.whenExpr)){
        state.whenSatisfied = true;
        state.canceled = false; state.done = false; state.paused = false; state.pausedRemaining = 0; state.firstRunDone = false;
        state.nextAt = Date.now() + (state.initialDelay !== undefined ? state.initialDelay : state.duration);
        changed = true;
      }
    }
    if(state.type === 'calc' && !state.canceled && !state.done && !state.paused && state.nextAt <= now){ runScheduledCalculation(state, key); changed = true; }
  });
  if(changed){ scheduleLineTimerSave(); }
  if(changed || Object.keys(npLineTimers).some(function(key){ var s=npLineTimers[key]; return s.started || s.endAt || (s.type === 'calc' && !s.canceled && !s.done && !s.paused); })){ renderNotepad(); }
}
npLineTimerTick = setInterval(tickLineTimers, 100);

renderNotepad();
</script>
</body>
