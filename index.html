<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Notepad Calculator</title>
<meta name="theme-color" content="#3C3489" />
<style>
  :root{
    --bg: #F7F7F5;
    --card: #FFFFFF;
    --surface-1: #F0EFEA;
    --border: #E3E1D9;
    --text-primary: #1C1C1A;
    --text-secondary: #5F5E5A;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg: #17171A;
      --card: #232326;
      --surface-1: #2B2B2F;
      --border: #35353A;
      --text-primary: #F1F0EC;
      --text-secondary: #B4B2A9;
    }
  }
  *{ box-sizing: border-box; }
  html, body{ height: 100%; margin: 0; }
  body{
    display: flex; flex-direction: column;
    font-family: var(--font); background: var(--bg); color: var(--text-primary);
    -webkit-tap-highlight-color: transparent;
  }
  header{
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 16px 20px; border-bottom: 1px solid var(--border); flex-shrink: 0;
  }
  h1{ font-size: 18px; font-weight: 700; margin: 0; }
  .top-row{ flex: 1; min-width: 0; }
  #npClear, #npExport, #npImportBtn, #npCsvBtn, #npCsvFromText, #npCsvExport, #npRowView, #npFontDown, #npFontUp, #npFind{
    height: 34px; padding: 0 14px; font-size: 13px; font-weight: 700; font-family: var(--font);
    border-radius: 8px; border: 1px solid var(--border); background: var(--card); color: var(--text-primary);
    cursor: pointer; flex-shrink: 0; margin-left: 8px;
  }
  #npFontDown, #npFontUp{ padding: 0 10px; }
  #npClear:active, #npExport:active, #npImportBtn:active, #npCsvBtn:active, #npCsvFromText:active, #npCsvExport:active, #npRowView:active, #npFontDown:active, #npFontUp:active, #npFind:active{ transform: scale(0.97); }
  #npRowView[aria-pressed="true"]{ background: #01558A; border-color: #01558A; color: #fff; }
  .np-ts-bright-group{
    display: flex; align-items: center; gap: 0; margin-left: 8px; flex-shrink: 0;
    border: 1px solid var(--border); border-radius: 8px; overflow: hidden;
  }
  .np-ts-bright-group button{
    height: 34px; width: 28px; padding: 0; font-size: 14px; font-weight: 700; font-family: var(--font);
    border: none; background: var(--card); color: var(--text-primary); cursor: pointer;
  }
  .np-ts-bright-group button:active{ background: var(--surface-1); }
  .np-ts-bright-group button:first-child{ border-right: 1px solid var(--border); }
  .np-ts-bright-group button:last-child{ border-left: 1px solid var(--border); }
  #npTsBrightValue{
    height: 34px; width: 46px; border: none; background: var(--card); color: var(--text-primary);
    font-size: 12px; font-weight: 700; font-family: var(--font); text-align: center;
    -moz-appearance: textfield;
  }
  #npTsBrightValue::-webkit-inner-spin-button, #npTsBrightValue::-webkit-outer-spin-button{
    -webkit-appearance: none; margin: 0;
  }
  .np-ts-bright-suffix{ font-size: 11px; color: var(--text-secondary); padding-right: 8px; background: var(--card); }
  #npSavedStatus{ font-size: 12px; font-weight: 700; color: var(--text-secondary); margin-right: 10px; white-space: nowrap; }
  .status-row{ display:flex; align-items:center; flex-shrink:0; }
  #npCsvNav{ margin-top: 8px; gap: 8px; }
  #npCsvPrev, #npCsvNext{
    height: 30px; width: 34px; font-size: 14px; font-weight: 700; font-family: var(--font);
    border-radius: 8px; border: 1px solid var(--border); background: var(--card); color: var(--text-primary);
    cursor: pointer; flex-shrink: 0;
  }
  #npCsvPrev:active, #npCsvNext:active{ transform: scale(0.97); }
  #npCsvSelect{
    height: 30px; padding: 0 8px; font-size: 13px; font-weight: 600; font-family: var(--font);
    border-radius: 8px; border: 1px solid var(--border); background: var(--card); color: var(--text-primary);
    cursor: pointer; max-width: 220px;
  }
  #npCsvCount{ font-size: 12px; font-weight: 700; color: var(--text-secondary); margin-left: 4px; white-space: nowrap; }
  #npCsvResetLinks{
    height: 30px; padding: 0 12px; font-size: 12px; font-weight: 700; font-family: var(--font);
    border-radius: 8px; border: 1px solid var(--border); background: var(--card); color: var(--text-primary);
    cursor: pointer; flex-shrink: 0; margin-left: 8px;
  }
  #npCsvResetLinks:active{ transform: scale(0.97); }

  #npFindBar, #npReplaceRow{ margin-top: 8px; gap: 8px; }
  #npFindInput, #npReplaceInput{
    height: 30px; padding: 0 10px; font-size: 13px; font-family: var(--font);
    border-radius: 8px; border: 1px solid var(--border); background: var(--card); color: var(--text-primary);
    width: 200px; flex-shrink: 0;
  }
  #npFindPrev, #npFindNext, #npFindCase, #npFindReplaceToggle, #npFindClose, #npReplaceOne, #npReplaceAll{
    height: 30px; padding: 0 10px; font-size: 12px; font-weight: 700; font-family: var(--font);
    border-radius: 8px; border: 1px solid var(--border); background: var(--card); color: var(--text-primary);
    cursor: pointer; flex-shrink: 0;
  }
  #npFindPrev, #npFindNext{ width: 30px; padding: 0; }
  #npFindPrev:active, #npFindNext:active, #npFindCase:active, #npFindReplaceToggle:active, #npFindClose:active, #npReplaceOne:active, #npReplaceAll:active{ transform: scale(0.97); }
  #npFindCase[aria-pressed="true"], #npFindReplaceToggle.on{ background: var(--accent, #3C3489); border-color: var(--accent, #3C3489); color: #fff; }
  #npFindClose{ width: 30px; padding: 0; font-size: 16px; line-height: 1; }
  #npFindCount{ font-size: 12px; font-weight: 700; color: var(--text-secondary); white-space: nowrap; min-width: 70px; }
  #npOverlay .np-find-hit{
    background: rgba(255, 200, 0, 0.35); border-radius: 2px;
  }
  #npOverlay .np-find-hit.np-find-current{ background: rgba(255, 140, 0, 0.6); }

  main{ flex: 1; display: flex; min-height: 0; }

  #npInputWrap{ position: relative; flex: 1; min-width: 0; }
  #npGutter{
    flex-shrink: 0; width: 44px; overflow: hidden;
    padding: 18px 0; text-align: right;
    background: var(--card); border-right: 1px solid var(--border);
    font-family: var(--font-mono); font-size: var(--np-font-size, 16px); line-height: var(--np-line-height, 30px);
    color: var(--text-secondary); opacity: 0.45; user-select: none;
  }
  #npGutter div{ padding-right: 10px; }

  #npRowGutter{
    flex-shrink: 0; width: 0; overflow: hidden; position: relative;
    background: var(--card); border-right: 1px solid var(--border);
    transition: width 0.15s ease;
  }
  #npRowGutter.active{ width: 34px; }
  .np-row-bracket{
    position: absolute; left: 6px; right: 4px;
    border-left: 3px solid #01558A; border-radius: 2px;
    display: flex; align-items: center; justify-content: center;
  }
  .np-row-bracket .row-label{
    writing-mode: vertical-rl; transform: rotate(180deg);
    font-family: var(--font-mono); font-size: 12px; font-weight: 700;
    color: #01558A; white-space: nowrap; padding-left: 4px;
  }

  textarea, #npOverlay{
    font-family: var(--font-mono); font-size: var(--np-font-size, 16px); font-weight: 700; line-height: var(--np-line-height, 30px);
  }
  #npInput{
    position: absolute; inset: 0; width: 100%; height: 100%;
    padding: 18px 20px; border: none;
    background: var(--card); color: var(--text-primary); resize: none; outline: none;
    overflow: auto; white-space: pre;
    z-index: 1;
  }
  #npOverlay{
    position: absolute; inset: 0;
    padding: 18px 20px;
    color: var(--text-secondary);
    white-space: pre;
    pointer-events: none;
    overflow: hidden;
    z-index: 2;
  }
  #npOverlay .ov-line{ height: var(--np-line-height, 30px); }
  #npOverlay .ov-ghost{ color: transparent; }
  #npOverlay .ov-result{ color: var(--text-secondary); }
  #npOverlay .ov-result.has-value{
    pointer-events: auto; cursor: pointer; border-radius: 4px;
    text-decoration: underline dashed; text-decoration-color: var(--border); text-underline-offset: 3px;
  }
  #npOverlay .ov-result.has-value:hover{ background: var(--surface-1); }
  #npOverlay .ov-result.ov-copied{ background: var(--surface-1); text-decoration: none; }
  #npOverlay .np-line-timer{
    display:inline-flex; align-items:center; gap:5px; margin-left:8px; vertical-align:middle;
    font:700 12px/24px var(--font); color:var(--text-primary); pointer-events:auto !important; position:relative; z-index:3;
  }
  #npOverlay .np-line-timer-display{
    min-width:112px; font-family:var(--font-mono); font-size:var(--np-font-size, 16px);
    line-height:24px; color:var(--text-secondary);
  }
  #npOverlay .np-line-timer-note{ max-width:180px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--text-secondary); }
  #npOverlay .np-line-timer-label{
    font-weight:700; color:#fff; background:var(--accent, #3C3489);
    padding:1px 8px; border-radius:10px; font-size:11px; white-space:nowrap;
    max-width:140px; overflow:hidden; text-overflow:ellipsis;
  }
  #npOverlay .np-line-timer button{
    height:24px; padding:0 8px; border:1px solid var(--border); border-radius:6px; background:var(--surface-1);
    color:var(--text-primary); font:700 11px var(--font); cursor:pointer; pointer-events:auto !important; position:relative; z-index:4;
  }
  #npOverlay .np-line-timer button.running{ background:var(--accent, #3C3489); color:#fff; border-color:var(--accent, #3C3489); }
  #npOverlay .np-line-timer-help{ color:var(--text-secondary); font-size:11px; }
  #npOverlay .ov-timestamp{
    color: rgba(0, 229, 255, var(--np-ts-alpha-main, 0.25));
    text-shadow: 0 0 6px rgba(0, 229, 255, var(--np-ts-alpha-glow1, 0.16)), 0 0 12px rgba(0, 229, 255, var(--np-ts-alpha-glow2, 0.09));
    font-weight: 700;
    pointer-events: none;
    user-select: none;
  }
  @keyframes ov-ts-blink{
    0%, 49%{ opacity: 1; }
    50%, 99%{ opacity: 0; }
    100%{ opacity: 1; }
  }
  #npOverlay .ov-timestamp.ov-ts-flash{
    animation: ov-ts-blink 0.333s linear 3;
    animation-fill-mode: forwards;
  }
  #npOverlay .ov-link-chip, #npOverlay .ov-web-link{
    display: inline-block; pointer-events: auto; cursor: pointer;
    font-size: 11px; font-weight: 700; font-family: var(--font);
    padding: 1px 7px; margin-left: 6px; border-radius: 10px;
    border: 1px solid var(--border); color: var(--text-secondary);
    background: var(--surface-1); vertical-align: middle;
    text-decoration: none;
  }
  #npOverlay .ov-web-link{
    color: #1a73e8; border-color: rgba(26, 115, 232, 0.4); background: rgba(26, 115, 232, 0.1);
  }
  #npOverlay .ov-web-link:hover{ filter: brightness(1.15); text-decoration: underline; }
  #npOverlay .ov-link-chip.linked{
    color: #ffb400; border-color: rgba(255, 180, 0, 0.5); background: rgba(255, 180, 0, 0.1);
  }
  #npOverlay .ov-link-chip:hover{ filter: brightness(1.15); }

  #npSuggest{
    position: fixed; display: none; z-index: 50;
    min-width: 100px; max-width: 220px; max-height: 200px; overflow-y: auto;
    background: var(--card); border: 1px solid var(--border); border-radius: 8px;
    box-shadow: 0 6px 18px rgba(0,0,0,0.18);
    font-family: var(--font-mono); font-size: 14px; font-weight: 700;
    padding: 4px;
  }
  #npSuggest .np-sugg-item{
    padding: 6px 10px; border-radius: 6px; cursor: pointer; color: var(--text-primary);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #npSuggest .np-sugg-item.active{ background: var(--surface-1); }

  .np-timer-panel{
    position: fixed; top: 64px; right: 16px; width: 300px; z-index: 60;
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.22); padding: 14px; font-family: var(--font);
  }
  .np-timer-header{ display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .np-timer-title{ font-size: 14px; font-weight: 700; color: var(--text-primary); }
  #npTimerClose{
    border: none; background: transparent; font-size: 18px; line-height: 1; cursor: pointer;
    color: var(--text-secondary); padding: 0 4px;
  }
  .np-timer-tabs{ display: flex; gap: 4px; margin-bottom: 12px; border-bottom: 1px solid var(--border); }
  .np-timer-tab{
    flex: 1; border: none; background: transparent; padding: 8px 4px; font-size: 12px; font-weight: 700;
    color: var(--text-secondary); cursor: pointer; border-bottom: 2px solid transparent;
  }
  .np-timer-tab.active{ color: var(--text-primary); border-bottom-color: var(--accent, #3C3489); }
  .np-timer-section{ display: none; }
  .np-timer-section.active{ display: block; }
  .np-timer-display{
    font-family: var(--font-mono); font-size: 30px; font-weight: 700; text-align: center;
    color: var(--text-primary); margin: 6px 0 14px; letter-spacing: 1px;
  }
  .np-timer-btnrow{ display: flex; gap: 8px; }
  .np-timer-btnrow button{
    flex: 1; height: 36px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--surface-1); color: var(--text-primary); font-weight: 700; font-size: 13px; cursor: pointer;
  }
  .np-timer-btnrow button:active{ transform: scale(0.97); }
  .np-timer-btnrow button.running{ background: var(--accent, #3C3489); color: #fff; border-color: var(--accent, #3C3489); }
  .np-timer-setrow{ display: flex; gap: 8px; margin-bottom: 12px; }
  .np-timer-field{ flex: 1; text-align: center; }
  .np-timer-field label{ display: block; font-size: 11px; color: var(--text-secondary); margin-bottom: 3px; }
  .np-timer-field input{
    width: 100%; height: 34px; text-align: center; border-radius: 8px; border: 1px solid var(--border);
    background: var(--bg); color: var(--text-primary); font-size: 14px; font-family: var(--font);
  }
  .np-timer-field-wide{ text-align: left; margin-bottom: 10px; }
  .np-timer-field-wide label{ text-align: left; }
  .np-timer-field-wide input{ text-align: left; padding: 0 10px; }
  .np-timer-hint{ font-size: 12px; color: var(--text-secondary); margin: 0 0 12px; line-height: 1.4; }
  .np-timer-quickrow{ display: flex; gap: 6px; margin-bottom: 10px; }
  .np-timer-quickrow button{
    flex: 1; height: 28px; border-radius: 6px; border: 1px solid var(--border);
    background: var(--surface-1); color: var(--text-primary); font-size: 11px; font-weight: 700; cursor: pointer;
  }
  .np-timer-addbtn{
    width: 100%; height: 36px; border-radius: 8px; border: 1px solid var(--accent, #3C3489);
    background: var(--accent, #3C3489); color: #fff; font-weight: 700; font-size: 13px; cursor: pointer; margin-bottom: 10px;
  }
  .np-timer-remlist{ max-height: 160px; overflow-y: auto; }
  .np-timer-remitem{
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: 7px 0; border-top: 1px solid var(--border); font-size: 12px;
  }
  .np-timer-remitem:first-child{ border-top: none; }
  .np-timer-reminfo{ overflow: hidden; }
  .np-timer-remnote{ font-weight: 700; color: var(--text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .np-timer-remtime{ color: var(--text-secondary); }
  .np-timer-remcancel{
    border: none; background: transparent; color: var(--danger); font-size: 12px; font-weight: 700; cursor: pointer; flex-shrink: 0;
  }

  .np-alarm-overlay{
    position: fixed; inset: 0; z-index: 100; background: rgba(0,0,0,0.55);
    display: flex; align-items: center; justify-content: center;
  }
  .np-alarm-box{
    background: var(--card); border-radius: 14px; padding: 28px 32px; text-align: center;
    box-shadow: 0 20px 50px rgba(0,0,0,0.35); max-width: 320px;
  }
  .np-alarm-title{ font-size: 20px; font-weight: 700; color: var(--text-primary); margin-bottom: 8px; }
  .np-alarm-msg{ font-size: 14px; color: var(--text-secondary); margin-bottom: 18px; word-break: break-word; }
  #npAlarmDismiss{
    height: 40px; padding: 0 24px; border-radius: 8px; border: none;
    background: var(--accent, #3C3489); color: #fff; font-weight: 700; font-size: 14px; cursor: pointer;
  }

  @media (max-width: 560px){
    #npInput, #npOverlay{ padding: 18px 12px; }
  }
</style>
</head>
<body>
<header>
  <div class="top-row">
    <h1>Vml's Notepad calculator</h1>
  </div>
  <div class="status-row">
    <span id="npSavedStatus"></span>
    <button id="npFontDown" aria-label="Decrease font size">A-</button>
    <button id="npFontUp" aria-label="Increase font size">A+</button>
    <div class="np-ts-bright-group" title="Timestamp brightness">
      <button id="npTsBrightDown" aria-label="Decrease timestamp brightness">-</button>
      <input type="number" id="npTsBrightValue" min="0" max="100" step="5" aria-label="Timestamp brightness percent" />
      <span class="np-ts-bright-suffix">%</span>
      <button id="npTsBrightUp" aria-label="Increase timestamp brightness">+</button>
    </div>
    <button id="npExport">Export</button>
    <button id="npImportBtn">Import</button>
    <input type="file" id="npImportFile" accept=".txt,text/plain" style="display:none;" />
    <button id="npCsvBtn">Import CSV</button>
    <input type="file" id="npCsvFile" accept=".csv,text/csv" style="display:none;" />
    <button id="npCsvFromText" title="Type or paste CSV-style rows (e.g. Product,Price) directly in the notepad, select them, then click this — no separate file needed">CSV from Text</button>
    <button id="npCsvExport" title="Save the currently loaded CSV data (however it was loaded/edited) as a downloadable .csv file">Export CSV</button>
    <button id="npRowView" title="Toggle between single-record view and all CSV rows expanded in the notepad, grouped with row/column labels" aria-pressed="false">Row View</button>
    <button id="npFind" title="Find text (Ctrl/Cmd+F). Add Replace with the toggle inside.">Find</button>
    <button id="npTimerBtn" style="display:none" aria-hidden="true" tabindex="-1">Timer</button>
    <button id="npClear">Clear</button>
  </div>
  <div class="status-row" id="npFindBar" style="display:none;">
    <input type="text" id="npFindInput" placeholder="Find" aria-label="Find text" />
    <button id="npFindPrev" aria-label="Previous match">&#8593;</button>
    <button id="npFindNext" aria-label="Next match">&#8595;</button>
    <span id="npFindCount"></span>
    <button id="npFindCase" title="Toggle case-sensitive match" aria-pressed="false">Aa</button>
    <button id="npFindReplaceToggle" title="Show/hide replace">Replace</button>
    <button id="npFindClose" aria-label="Close find bar">&times;</button>
  </div>
  <div class="status-row" id="npReplaceRow" style="display:none;">
    <input type="text" id="npReplaceInput" placeholder="Replace with" aria-label="Replace with" />
    <button id="npReplaceOne">Replace</button>
    <button id="npReplaceAll">Replace All</button>
  </div>
  <div class="status-row" id="npCsvNav" style="display:none;">
    <button id="npCsvPrev" aria-label="Previous record">&#8592;</button>
    <select id="npCsvSelect"></select>
    <button id="npCsvNext" aria-label="Next record">&#8594;</button>
    <span id="npCsvCount"></span>
    <button id="npCsvResetLinks" title="Unlink every line from its CSV column">Reset Links</button>
  </div>
</header>
<main>
  <div id="npRowGutter"></div>
  <div id="npGutter"></div>
  <div id="npInputWrap">
    <textarea id="npInput" spellcheck="true" wrap="off"></textarea>
    <div id="npOverlay" aria-hidden="true"></div>
  </div>
</main>
<div id="npSuggest"></div>

<div id="npTimerPanel" class="np-timer-panel" style="display:none;">
  <div class="np-timer-header">
    <span class="np-timer-title">Timer</span>
    <button id="npTimerClose" aria-label="Close timer panel">&times;</button>
  </div>

  <div class="np-timer-tabs">
    <button class="np-timer-tab active" data-timertab="stopwatch">Stopwatch</button>
    <button class="np-timer-tab" data-timertab="countdown">Countdown</button>
    <button class="np-timer-tab" data-timertab="reminder">Reminder</button>
  </div>

  <!-- Stopwatch -->
  <div class="np-timer-section active" id="npSwSection">
    <div class="np-timer-display" id="npSwDisplay">00:00:00</div>
    <div class="np-timer-btnrow">
      <button id="npSwStartPause">Start</button>
      <button id="npSwReset">Reset</button>
    </div>
  </div>

  <!-- Countdown -->
  <div class="np-timer-section" id="npCdSection">
    <div class="np-timer-display" id="npCdDisplay">00:00:00</div>
    <div class="np-timer-setrow" id="npCdSetRow">
      <div class="np-timer-field"><label>H</label><input type="number" id="npCdH" min="0" max="99" value="0" /></div>
      <div class="np-timer-field"><label>M</label><input type="number" id="npCdM" min="0" max="59" value="5" /></div>
      <div class="np-timer-field"><label>S</label><input type="number" id="npCdS" min="0" max="59" value="0" /></div>
    </div>
    <div class="np-timer-btnrow">
      <button id="npCdStartPause">Start</button>
      <button id="npCdReset">Reset</button>
    </div>
  </div>

  <!-- Reminder -->
  <div class="np-timer-section" id="npRemSection">
    <p class="np-timer-hint">Set a time, add a short note, and this tab will alert you when it's due (while this page stays open in your browser).</p>
    <div class="np-timer-field np-timer-field-wide">
      <label>When</label>
      <input type="datetime-local" id="npRemWhen" />
    </div>
    <div class="np-timer-field np-timer-field-wide">
      <label>Note</label>
      <input type="text" id="npRemNote" placeholder="e.g. Call the client" maxlength="80" />
    </div>

function finalizeEditedLines(){

      npLastFinalizedText[i] = trimmed;

// makes every row's name usable directly in formulas, standing in for its price
// -- e.g. "Pen*2 + Pencil*5" -- without typing "Pen = 20" first. Rebuilt whenever
// CSV data loads or changes; a user-defined variable of the same name always wins.
var npCsvPriceMap = {};
function rebuildCsvPriceMap(){
  npCsvPriceMap = {};
  if(!npCsvHeaders.length || !npCsvRows.length){ return; }
  var nameCol = npCsvHeaders.filter(function(h){ return /name|product|item/i.test(h); })[0] || npCsvHeaders[0];
  var priceCol = npCsvHeaders.filter(function(h){ return /price|cost|amount|value|rate/i.test(h); })[0]
    || npCsvHeaders.filter(function(h){ return h !== nameCol; })[0] || npCsvHeaders[0];
  npCsvRows.forEach(function(row){
    var name = (row[nameCol] || '').trim();
    var priceRaw = (row[priceCol] || '').replace(/[^0-9.\-]/g, '');
    var price = parseFloat(priceRaw);
    if(name && !isNaN(price)){ npCsvPriceMap[name] = price; }
  });
}
rebuildCsvPriceMap();

function parseCSV(text){
  var lines = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n').split('\n').filter(function(l){ return l.length > 0; });
  function parseLine(line){
    var fields = [];
    var cur = '';
    var inQuotes = false;
    for(var i = 0; i < line.length; i++){
      var ch = line[i];
      if(inQuotes){
        if(ch === '"'){
          if(line[i + 1] === '"'){ cur += '"'; i++; }
          else { inQuotes = false; }
        } else { cur += ch; }
      } else {
        if(ch === '"'){ inQuotes = true; }
        else if(ch === ','){ fields.push(cur); cur = ''; }
        else { cur += ch; }
      }
    }
    fields.push(cur);
    return fields.map(function(f){ return f.trim(); });
  }
  if(!lines.length){ return { headers: [], rows: [] }; }
  var headers = parseLine(lines[0]);
  var rows = lines.slice(1).map(function(line){
    var fields = parseLine(line);
    var row = {};
    headers.forEach(function(h, i){ row[h] = fields[i] !== undefined ? fields[i] : ''; });
    return row;
  });
  return { headers: headers, rows: rows };
}

function csvEscapeField(val){
  val = (val === undefined || val === null) ? '' : String(val);
  if(/[",\n]/.test(val)){ return '"' + val.replace(/"/g, '""') + '"'; }
  return val;
}
function buildCsvText(){
  if(!npCsvHeaders.length){ return ''; }
  var lines = [npCsvHeaders.map(csvEscapeField).join(',')];
  npCsvRows.forEach(function(row){
    lines.push(npCsvHeaders.map(function(h){ return csvEscapeField(row[h]); }).join(','));
  });
  return lines.join('\n');
}

function applyCsvRecordToText(record){
  if(!record){ return; }
  var lines = npInput.value.split('\n');
  var changed = false;
  var newLines = lines.map(function(line, i){
    var m = line.match(/^(\s*)(@?)([A-Za-z_][A-Za-z0-9_]*)(\s*)=(\s*)(.*)$/);
    if(m){
      var varName = m[3];
      var col = npLineLinks['var:' + varName];
      if(col && Object.prototype.hasOwnProperty.call(record, col)){
        var rebuilt = m[1] + m[2] + varName + m[4] + '=' + m[5] + record[col];
        if(rebuilt !== line){ changed = true; }
        return rebuilt;
      }
      return line;
    }
    if(line.trim()){
      var lineCol = npLineLinks['line:' + i];
      if(lineCol && Object.prototype.hasOwnProperty.call(record, lineCol)){
        var indentMatch = line.match(/^(\s*)/);
        var rebuiltBare = indentMatch[1] + record[lineCol];
        if(rebuiltBare !== line){ changed = true; }
        return rebuiltBare;
      }
    }
    return line;
  });
  if(changed){
    npInput.value = newLines.join('\n');
    renderNotepad();
    finalizeEditedLines();
    npScheduleSave();
  }
}

function normalizeUnit(u){
  u = (u || '').trim().toLowerCase();
  if(CURRENCY_SYMBOLS[u]) return CURRENCY_SYMBOLS[u];
  return u;
}

function convertValue(val, fromUnit, toUnit){
  fromUnit = normalizeUnit(fromUnit);
  toUnit = normalizeUnit(toUnit);

  // Temperature
  var isTemp = function(u){ return /^(c|degc|celsius|f|degf|fahrenheit|k|kelvin|degk)$/i.test(u); };
  if(isTemp(fromUnit) && isTemp(toUnit)){
    var c;
    if(/^c/i.test(fromUnit)) c = val;
    else if(/^f/i.test(fromUnit)) c = (val - 32) * 5 / 9;
    else if(/^k/i.test(fromUnit)) c = val - 273.15;

    if(/^c/i.test(toUnit)) return c;
    if(/^f/i.test(toUnit)) return (c * 9 / 5) + 32;
    if(/^k/i.test(toUnit)) return c + 273.15;
  }

  // Currency
  var fromCurr = fromUnit.toUpperCase();
  var toCurr = toUnit.toUpperCase();
  if(npCurrencyRates[fromCurr] && npCurrencyRates[toCurr]){
    var valUSD = val / npCurrencyRates[fromCurr];
    return valUSD * npCurrencyRates[toCurr];
  }

  // Standard Metric / Imperial
  var u1 = NP_UNITS[fromUnit];
  var u2 = NP_UNITS[toUnit];
  if(u1 && u2 && u1.cat === u2.cat){
    var baseVal = val * u1.r;
    return baseVal / u2.r;
  }

  return null;
}

// Date Arithmetic
var DATE_TOKEN_PATTERN = '(?:\\d{4}-\\d{2}-\\d{2}(?:[ T]\\d{1,2}:\\d{2}(?::\\d{2})?)?|today|now|[A-Za-z_][A-Za-z0-9_]*)';
var LEADING_DATE_RE = new RegExp('^\\s*(' + DATE_TOKEN_PATTERN + ')\\s*(.*)$', 'i');
var DATE_DIFF_RE = new RegExp('^\\s*(' + DATE_TOKEN_PATTERN + ')\\s*-\\s*(' + DATE_TOKEN_PATTERN + ')\\s*$', 'i');

function parseDateToken(str, dateScope){
  str = (str || '').trim();
  if(!str){ return null; }
  if(Object.prototype.hasOwnProperty.call(dateScope, str)){ return new Date(dateScope[str].getTime()); }
  if(/^today$/i.test(str)){ var t = new Date(); t.setHours(0, 0, 0, 0); return t; }
  if(/^now$/i.test(str)){ return new Date(); }
  var m = str.match(/^(\d{4})-(\d{2})-(\d{2})(?:[ T](\d{1,2}):(\d{2})(?::(\d{2}))?)?$/);
  if(!m){ return null; }
  var y = parseInt(m[1], 10), mo = parseInt(m[2], 10) - 1, da = parseInt(m[3], 10);
  var h = m[4] !== undefined ? parseInt(m[4], 10) : 0;
  var mi = m[5] !== undefined ? parseInt(m[5], 10) : 0;
  var se = m[6] !== undefined ? parseInt(m[6], 10) : 0;
  var d = new Date(y, mo, da, h, mi, se);
  return isNaN(d.getTime()) ? null : d;
}

var NP_DAY_NAMES = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
function formatDateOut(d, hasTime){
  var s = d.getFullYear() + '/' + pad2(d.getMonth() + 1) + '/' + pad2(d.getDate());
  if(hasTime){ s += '/' + pad2(d.getHours()) + ':' + pad2(d.getMinutes()) + ':' + pad2(d.getSeconds()); }
  s += ' (' + NP_DAY_NAMES[d.getDay()] + ')';
  return s;
}

function calendarDiffBreak(a, b){
  var years = b.getFullYear() - a.getFullYear();
  var months = b.getMonth() - a.getMonth();
  var days = b.getDate() - a.getDate();
  var hours = b.getHours() - a.getHours();
  var minutes = b.getMinutes() - a.getMinutes();
  var seconds = b.getSeconds() - a.getSeconds();
  if(seconds < 0){ seconds += 60; minutes--; }
  if(minutes < 0){ minutes += 60; hours--; }
  if(hours < 0){ hours += 24; days--; }
  if(days < 0){
    var prevMonthLastDay = new Date(b.getFullYear(), b.getMonth(), 0).getDate();
    days += prevMonthLastDay;
    months--;
  }
  if(months < 0){ months += 12; years--; }
  return { years: years, months: months, days: days, hours: hours, minutes: minutes, seconds: seconds };
}

function tryDateDiff(exprText, dateScope){
  var m = exprText.match(DATE_DIFF_RE);
  if(!m){ return null; }
  var d1 = parseDateToken(m[1], dateScope);
  var d2 = parseDateToken(m[2], dateScope);
  if(!d1 || !d2){ return null; }
  var neg = d1 < d2;
  var a = neg ? d1 : d2;
  var b = neg ? d2 : d1;
  var diff = calendarDiffBreak(a, b);
  var parts = [];
  if(diff.years) parts.push(diff.years + ' year' + (diff.years !== 1 ? 's' : ''));
  if(diff.months) parts.push(diff.months + ' month' + (diff.months !== 1 ? 's' : ''));
  if(diff.days) parts.push(diff.days + ' day' + (diff.days !== 1 ? 's' : ''));
  if(diff.hours) parts.push(diff.hours + ' hour' + (diff.hours !== 1 ? 's' : ''));
  if(diff.minutes) parts.push(diff.minutes + ' minute' + (diff.minutes !== 1 ? 's' : ''));
  if(diff.seconds || !parts.length) parts.push(diff.seconds + ' second' + (diff.seconds !== 1 ? 's' : ''));
  var totalDays = Math.round((b.getTime() - a.getTime()) / 86400000);
  var signedTotalDays = neg ? -totalDays : totalDays;
  var text = (neg ? '-' : '') + parts.join(', ') + ' (' + signedTotalDays + ' days total)';
  return { text: text, totalDays: signedTotalDays };
}

function tryDateArithmetic(exprText, dateScope){
  var m = exprText.match(LEADING_DATE_RE);
  if(!m){ return null; }
  var base = parseDateToken(m[1], dateScope);
  if(!base){ return null; }
  var rest = m[2] || '';
  var hasTime = /:/.test(m[1]) || /^now$/i.test(m[1].trim()) ||
    (base.getHours() !== 0 || base.getMinutes() !== 0 || base.getSeconds() !== 0);
  if(!rest.trim()){
    return { date: new Date(base.getTime()), hasTime: hasTime };
  }
  var result = new Date(base.getTime());
  var anyTerm = false;
  var termRe = /([+\-])\s*(\d+(?:\.\d+)?)\s*(y|mo|d|h|min|s)\b/gi;
  var match;
  while((match = termRe.exec(rest)) !== null){
    anyTerm = true;
    var sign = match[1] === '-' ? -1 : 1;
    var amt = parseFloat(match[2]) * sign;
    var unit = match[3].toLowerCase();
    if(unit === 'y'){ result.setFullYear(result.getFullYear() + amt); }
    else if(unit === 'mo'){ result.setMonth(result.getMonth() + amt); }
    else if(unit === 'd'){ result.setDate(result.getDate() + amt); }
    else if(unit === 'h'){ result.setHours(result.getHours() + amt); hasTime = true; }
    else if(unit === 'min'){ result.setMinutes(result.getMinutes() + amt); hasTime = true; }
    else if(unit === 's'){ result.setSeconds(result.getSeconds() + amt); hasTime = true; }
  }
  if(!anyTerm){ return null; }
  var remainder = rest.replace(/([+\-])\s*(\d+(?:\.\d+)?)\s*(y|mo|d|h|min|s)\b/gi, '').trim();
  if(remainder !== ''){ return null; }
  return { date: result, hasTime: hasTime };
}

function substituteCsvPrices(exprText, scope){
  // Every CSV row's name column becomes usable directly in formulas as a
  // stand-in for its price column -- e.g. "Pen*2 + Pencil*5" -- once a CSV
  // with product/price-like columns has been imported. A user-defined
  // variable (assigned with "=" anywhere in the notepad) of the same name
  // always takes precedence, so this never silently overrides your own work.
  var names = Object.keys(npCsvPriceMap);
  if(!names.length){ return exprText; }
  names.sort(function(a, b){ return b.length - a.length; }); // longest first, so multi-word names aren't shadowed by a shorter prefix
  names.forEach(function(name){
    if(Object.prototype.hasOwnProperty.call(scope, name)){ return; }
    if(Object.prototype.hasOwnProperty.call(NP_BUILTINS, name)){ return; }
    var re = new RegExp('\\b' + escapeRegExp(name) + '\\b', 'gi');
    exprText = exprText.replace(re, '(' + npCsvPriceMap[name] + ')');
  });
  return exprText;
}
function substituteIfThenElse(exprText){
  // "if COND then A else B" -> "((COND)?(A):(B))". The else-branch is greedy
  // and re-processed recursively, so "if a then 1 else if b then 2 else 3"
  // chains correctly. (Nesting an if/then/else INSIDE the then-branch isn't
  // supported by this simple pattern -- put it in the else-chain instead.)
  var m = exprText.match(/^if\s+(.+?)\s+then\s+(.+?)\s+else\s+(.+)$/i);
  if(!m){ return exprText; }
  var elseBranch = substituteIfThenElse(m[3].trim());
  return '((' + m[1].trim() + ')?(' + m[2].trim() + '):(' + elseBranch + '))';
}

function substituteDateComponents(exprText, dateScope){
  return exprText.replace(/\b(year|month|day|hour|minute|second|weekday)\s*\(\s*([^)]+?)\s*\)/gi, function(match, fn, inner){
    var d = parseDateToken(inner, dateScope);
    if(!d){ return match; }
    fn = fn.toLowerCase();
    var val;
    if(fn === 'year'){ val = d.getFullYear(); }
    else if(fn === 'month'){ val = d.getMonth() + 1; }
    else if(fn === 'day'){ val = d.getDate(); }
    else if(fn === 'hour'){ val = d.getHours(); }
    else if(fn === 'minute'){ val = d.getMinutes(); }
    else if(fn === 'second'){ val = d.getSeconds(); }
    else if(fn === 'weekday'){ val = d.getDay(); }
    return String(val);
  });
}

function evaluateNotepad(text){
  var lines = text.split('\n');
  var scope = {};
  var dateScope = {};
  var constDeclaredAt = {};
  var lineValues = [];
  var results = [];
  lines.forEach(function(rawLine, idx){
    var trimmed = rawLine.trim();
    if(!trimmed){ results.push(''); lineValues.push(undefined); return; }
    var work = trimmed.replace(/=+\s*$/, '').trim();
    var assignMatch = work.match(/^(@)?([A-Za-z_][A-Za-z0-9_]*)\s*=\s*(.+)$/);
    var exprText, varName = null, selfUpdateName = null, isConstDecl = false;
    if(assignMatch){
      isConstDecl = !!assignMatch[1];
      varName = assignMatch[2];
      exprText = assignMatch[3];
    } else {
      exprText = work;
      var compoundMatch = work.match(/^([A-Za-z_][A-Za-z0-9_]*)\s*([+\-*/])=\s*(.+)$/);
      if(compoundMatch){
        selfUpdateName = compoundMatch[1];
        exprText = selfUpdateName + compoundMatch[2] + '(' + compoundMatch[3] + ')';
      } else {
        var selfMatch = work.match(/^([A-Za-z_][A-Za-z0-9_]*)\s*[+\-*/]/);
        if(selfMatch && Object.prototype.hasOwnProperty.call(scope, selfMatch[1]) && !Object.prototype.hasOwnProperty.call(constDeclaredAt, selfMatch[1])){
          selfUpdateName = selfMatch[1];
        }
      }
    }

    // "@name = expr" declares name as a constant: any later EXPLICIT write to
    // that name -- "name = ...", "@name = ...", or "name += ..." -- is
    // blocked instead of silently overwriting it. A bare reference with no
    // "=" at all (e.g. just "name*5" on its own line) is always read-only
    // and is never blocked, constant or not -- see the selfMatch guard above,
    // which skips the implicit self-update shortcut entirely for constants.
    var targetName = varName || selfUpdateName;
    if(targetName){
      if(Object.prototype.hasOwnProperty.call(constDeclaredAt, targetName)){
        results.push('= \u26A0 "' + targetName + '" is constant (set on line ' + (constDeclaredAt[targetName] + 1) + ')');
        lineValues.push(undefined);
        return;
      }
      if(isConstDecl){
        constDeclaredAt[targetName] = idx;
      }
    }

    exprText = substituteCsvPrices(exprText, scope);
    exprText = substituteIfThenElse(exprText);

    if(selfUpdateName === null){
      exprText = substituteDateComponents(exprText, dateScope);
      var diffOut = tryDateDiff(exprText, dateScope);
      if(diffOut){
        results.push('= ' + diffOut.text);
        if(varName){ scope[varName] = diffOut.totalDays; }
        lineValues.push(diffOut.totalDays);
        return;
      }
      var arithOut = tryDateArithmetic(exprText, dateScope);
      if(arithOut){
        var formattedDate = formatDateOut(arithOut.date, arithOut.hasTime);
        results.push('= ' + formattedDate);
        if(varName){
          dateScope[varName] = arithOut.date;
          scope[varName] = arithOut.date.getTime();
        }
        lineValues.push(arithOut.date.getTime());
        return;
      }
    }

    // Check for Unit / Currency conversion syntax: "100 USD to INR" or "10 km in miles"
    var convMatch = exprText.match(/^(.*?)\s+(?:to|in)\s+([A-Za-z0-9_/$%^]+)$/i);
    if(convMatch){
      var leftRaw = convMatch[1].trim();
      var targetUnit = convMatch[2].trim();
      var fromUnit = null;
      var valSubExpr = leftRaw;

      // Check prefix currency symbol like $100 or €50
      var prefSymMatch = leftRaw.match(/^([$€£₹¥])\s*(.+)$/);
      if(prefSymMatch){
        fromUnit = prefSymMatch[1];
        valSubExpr = prefSymMatch[2];
      } else {
        var sufUnitMatch = leftRaw.match(/^(.*?)\s*([A-Za-z_/$%^]+)$/);
        if(sufUnitMatch){
          valSubExpr = sufUnitMatch[1];
          fromUnit = sufUnitMatch[2];
        }
      }

      // Evaluate the numerical value expression cleanly
      var evalVal = null;
      try {
        var envTemp = Object.assign({}, NP_BUILTINS, scope);
        var argN = Object.keys(envTemp);
        var argV = argN.map(function(k){ return envTemp[k]; });
        var cleanValSub = valSubExpr.replace(/\bL(\d+)\b/gi, function(m, n){
          var rIdx = parseInt(n, 10) - 1;
          return (rIdx >= 0 && rIdx < idx && lineValues[rIdx] !== undefined) ? '(' + lineValues[rIdx] + ')' : '0';
        });
        var fnVal = new Function(argN.join(','), 'return (' + cleanValSub.replace(/\^/g, '**') + ');');
        evalVal = fnVal.apply(null, argV);
      } catch(e){}

      if(typeof evalVal === 'number' && !isNaN(evalVal) && fromUnit){
        var converted = convertValue(evalVal, fromUnit, targetUnit);
        if(converted !== null){
          converted = Math.round(converted * 10000) / 10000;
          results.push('= ' + converted + ' ' + targetUnit);
          if(varName){ scope[varName] = converted; }
          else if(selfUpdateName){ scope[selfUpdateName] = converted; }
          lineValues.push(converted);
          return;
        }
      }
    }

    if(!exprText || !/^[0-9A-Za-z_+\-*/(),.\s^%!:<>=?&|]*$/.test(exprText)){
      results.push('');
      lineValues.push(undefined);
      return;
    }

    // Resolve Range formulas over earlier lines. A line inside a range (or a
    // bare L# reference) that's out of bounds, not yet computed, or holds no
    // numeric value (blank line, text-only line, etc) counts as 0 rather than
    // voiding the whole formula.
    function rangeValues(a, b){
      var s = parseInt(a, 10) - 1, en = parseInt(b, 10) - 1;
      if(s > en){ var t = s; s = en; en = t; }
      var vals = [];
      for(var i = s; i <= en; i++){
        vals.push((i >= 0 && i < idx && lineValues[i] !== undefined) ? lineValues[i] : 0);
      }
      return vals;
    }
    var withFuncRanges = exprText.replace(/\b(sum|avg|average|min|max|count)\s*\(\s*L(\d+)\s*(?:to|:)\s*L(\d+)\s*\)/gi, function(m, fn, a, b){
      var vals = rangeValues(a, b);
      var lower = fn.toLowerCase();
      if(lower === 'sum'){ return '(' + vals.join('+') + ')'; }
      if(lower === 'avg' || lower === 'average'){ return '((' + vals.join('+') + ')/' + vals.length + ')'; }
      if(lower === 'min'){ return 'min(' + vals.join(',') + ')'; }
      if(lower === 'max'){ return 'max(' + vals.join(',') + ')'; }
      if(lower === 'count'){ return String(vals.length); }
      return '0';
    });

    var withBareRanges = withFuncRanges.replace(/\bL(\d+)\s*(?:to|:)\s*L(\d+)\b/gi, function(m, a, b){
      var vals = rangeValues(a, b);
      return '(' + vals.join('+') + ')';
    });

    var withLineRefs = withBareRanges.replace(/\bL(\d+)\b/gi, function(match, numStr){
      var refIdx = parseInt(numStr, 10) - 1;
      var v = (refIdx >= 0 && refIdx < idx && lineValues[refIdx] !== undefined) ? lineValues[refIdx] : 0;
      return '(' + v + ')';
    });

    try{
      var safe = withLineRefs.replace(/(\d+(\.\d+)?)!/g, 'fact($1)');
      safe = safe.replace(/(\d+(\.\d+)?)\s*%/g, '($1/100)');
      safe = safe.replace(/\^/g, '**');
      var env = {};
      Object.keys(NP_BUILTINS).forEach(function(k){ env[k] = NP_BUILTINS[k]; });
      Object.keys(scope).forEach(function(k){ env[k] = scope[k]; });
      var argNames = Object.keys(env);
      var argValues = argNames.map(function(k){ return env[k]; });
      var fn = new Function(argNames.join(','), 'return (' + safe + ');');
      var val = fn.apply(null, argValues);
      if(typeof val === 'boolean'){ val = val ? 1 : 0; }
      if(typeof val !== 'number' || !isFinite(val)){ results.push(''); lineValues.push(undefined); return; }
      val = Math.round(val * 10000) / 10000;
      if(varName){ scope[varName] = val; }
      else if(selfUpdateName){ scope[selfUpdateName] = val; }
      lineValues.push(val);
      var isPlainLiteralAssign = varName && /^-?\d+(\.\d+)?$/.test(exprText.trim()) && parseFloat(exprText.trim()) === val;
      results.push(isPlainLiteralAssign ? '' : ('= ' + val));
    }catch(e){
      results.push(''); lineValues.push(undefined);
    }
  });
  return { results: results, scope: scope };
}

function escapeHtml(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function escapeRegExp(s){
  return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
}
function buildGhostHtml(rawLine, lineGlobalStart){
  var text = rawLine.length ? rawLine : ' ';
  if(!npFindState.query){ return escapeHtml(text); }
  var flags = npFindState.caseSensitive ? 'g' : 'gi';
  var re;
  try{ re = new RegExp(escapeRegExp(npFindState.query), flags); }catch(e){ return escapeHtml(text); }
  var html = '', lastIndex = 0, m;
  while((m = re.exec(text)) !== null){
    var matchGlobalStart = lineGlobalStart + m.index;
    var isCurrent = npFindState.matches[npFindState.currentIndex] && npFindState.matches[npFindState.currentIndex].start === matchGlobalStart;
    html += escapeHtml(text.slice(lastIndex, m.index));
    html += '<span class="np-find-hit' + (isCurrent ? ' np-find-current' : '') + '">' + escapeHtml(m[0]) + '</span>';
    lastIndex = m.index + m[0].length;
    if(m[0].length === 0){ re.lastIndex++; }
  }
  html += escapeHtml(text.slice(lastIndex));
  return html;
}
function renderNotepad(){
  var lines = npInput.value.split('\n');
  var evalOut = evaluateNotepad(npInput.value);
  var results = evalOut.results;
  npKnownVars = Object.keys(evalOut.scope);
  var tsChanged = false;
  var nextTimestamps = [];
  var prevTimestamps = npLineTimestamps;
  var usedPrevIdx = {};
  npLineTimerSeenKeys = {};
  var runningOffset = 0;
  var html = lines.map(function(rawLine, i){
    var res = results[i] || '';
    var ghostHtml = buildGhostHtml(rawLine, runningOffset);
    runningOffset += rawLine.length + 1;
    var displayText = '';
    var valueOnly = '';
    if(res){
      valueOnly = res.replace(/^=\s*/, '');
      var hasTrailingEq = /=\s*$/.test(rawLine.trim());
      displayText = hasTrailingEq ? (' ' + valueOnly) : (' = ' + valueOnly);
    }
    var resultClass = res ? 'ov-result has-value' : 'ov-result';
    var dataAttr = res ? ' data-value="' + escapeHtml(valueOnly) + '" title="Click to copy"' : '';

    var trimmedLine = rawLine.trim();
    var tsSpan = '';
    if(trimmedLine){
      var existing = prevTimestamps[i];
      var entry;
      if(existing && existing.text === trimmedLine && !usedPrevIdx[i]){
        // Fast path: this line hasn't moved -- same text, same position.
        entry = existing;
        usedPrevIdx[i] = true;
      } else {
        // The line's own position didn't match (likely shifted because a
        // line was added/removed above it). Before stamping it as "new",
        // search the PREVIOUS timestamp list for this exact text elsewhere
        // (not already claimed by another line this pass), preferring the
        // closest original position. If found, that line simply moved --
        // carry its original timestamp forward instead of resetting it.
        var bestIdx = -1, bestDist = Infinity;
        for(var j = 0; j < prevTimestamps.length; j++){
          if(usedPrevIdx[j]){ continue; }
          var cand = prevTimestamps[j];
          if(cand && cand.text === trimmedLine){
            var dist = Math.abs(j - i);
            if(dist < bestDist){ bestDist = dist; bestIdx = j; }
          }
        }
        if(bestIdx !== -1){
          entry = prevTimestamps[bestIdx];
          usedPrevIdx[bestIdx] = true;
        } else {
          entry = { text: trimmedLine, ts: formatNpTimestamp(new Date()) };
          tsChanged = true;
        }
      }
      nextTimestamps[i] = entry;
      var isSettled = npLastFinalizedText[i] === trimmedLine;
      if(isSettled){
        var flashClass = npFlashLines[i] ? ' ov-ts-flash' : '';
        tsSpan = '<span class="ov-timestamp' + flashClass + '"> (' + entry.ts + ')</span>';
      }
    } else {
      nextTimestamps[i] = null;
    }

    var linkChip = '';
    if(npCsvHeaders.length && trimmedLine){
      var lineMatch = rawLine.match(/^\s*@?([A-Za-z_][A-Za-z0-9_]*)\s*=/);
      var linkKey = lineMatch ? ('var:' + lineMatch[1]) : ('line:' + i);
      var linkedCol = npLineLinks[linkKey];
      var chipClass = linkedCol ? 'ov-link-chip linked' : 'ov-link-chip';
      var chipLabel = linkedCol ? ('\uD83D\uDD17 ' + linkedCol) : '\uD83D\uDD17 link';
      linkChip = '<span class="' + chipClass + '" data-linkkey="' + escapeHtml(linkKey) + '" title="Click to link this line to a CSV column">' + escapeHtml(chipLabel) + '</span>';
    }

    // Auto-hyperlinks detector for web addresses
    var webLinksHtml = '';
    if(trimmedLine){
      var urlRegex = /(https?:\/\/[^\s]+|www\.[^\s]+|[a-zA-Z0-9.-]+\.(?:com|org|net|edu|gov|io|co|in|app|dev|me|info)(?:\/[^\s]*)?)/gi;
      var urlMatch;
      while((urlMatch = urlRegex.exec(rawLine)) !== null){
        var u = urlMatch[1];
        var href = /^https?:\/\//i.test(u) ? u : ('https://' + u);
        webLinksHtml += '<a class="ov-web-link" href="' + escapeHtml(href) + '" target="_blank" rel="noopener" title="Open ' + escapeHtml(href) + '">&#128279; ' + escapeHtml(u) + '</a>';
      }
    }

    return '<div class="ov-line"><span class="ov-ghost">' + ghostHtml + '</span><span class="' + resultClass + '"' + dataAttr + '>' + escapeHtml(displayText) + '</span>' + lineTimerMarkup(rawLine, i) + webLinksHtml + linkChip + tsSpan + '</div>';
  }).join('');
  npOverlay.innerHTML = html;
  npLineTimestamps = nextTimestamps;
  if(tsChanged){ npScheduleTsSave(); }
  pruneLineTimers();

  var gutterHtml = lines.map(function(_, i){ return '<div>' + (i + 1) + '</div>'; }).join('');
  npGutter.innerHTML = gutterHtml;
  npGutter.scrollTop = npInput.scrollTop;
  renderRowBrackets();
}

var npSaveTimer = null;
function npSaveNow(){
  try{
    localStorage.setItem(NP_STORAGE_KEY, npInput.value);
    npSavedStatus.textContent = 'Saved';
    setTimeout(function(){ npSavedStatus.textContent = ''; }, 1200);
  }catch(e){
    npSavedStatus.textContent = 'Could not save';
  }
}
function npScheduleSave(){
  npSavedStatus.textContent = '';
  clearTimeout(npSaveTimer);
  npSaveTimer = setTimeout(npSaveNow, 500);
}

document.getElementById('npClear').addEventListener('click', function(){
  npInput.value = '';
  renderNotepad();
  npSaveNow();
  npInput.focus();
});

/* ---------------- Find & Replace ---------------- */
var npFindState = { query: '', caseSensitive: false, matches: [], currentIndex: -1 };
var npFindBarEl = document.getElementById('npFindBar');
var npReplaceRowEl = document.getElementById('npReplaceRow');
var npFindInputEl = document.getElementById('npFindInput');
var npReplaceInputEl = document.getElementById('npReplaceInput');
var npFindCountEl = document.getElementById('npFindCount');

function computeFindMatches(){
  npFindState.matches = [];
  var q = npFindState.query;
  if(!q){ return; }
  var flags = npFindState.caseSensitive ? 'g' : 'gi';
  var re;
  try{ re = new RegExp(escapeRegExp(q), flags); }catch(e){ return; }
  var text = npInput.value;
  var m;
  while((m = re.exec(text)) !== null){
    npFindState.matches.push({ start: m.index, end: m.index + m[0].length });
    if(m[0].length === 0){ re.lastIndex++; }
  }
}

function updateFindCount(){
  if(!npFindState.query){ npFindCountEl.textContent = ''; return; }
  if(!npFindState.matches.length){ npFindCountEl.textContent = 'No results'; return; }
  npFindCountEl.textContent = (npFindState.currentIndex + 1) + ' / ' + npFindState.matches.length;
}

function scrollToSelection(start){
  // Approximate the line containing `start` and scroll it into view, mirroring
  // the line-height math used elsewhere for gutter/overlay sync.
  var upTo = npInput.value.slice(0, start);
  var lineNum = upTo.split('\n').length - 1;
  var lineHeight = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--np-line-height')) || 30;
  var target = lineNum * lineHeight;
  if(target < npInput.scrollTop || target > npInput.scrollTop + npInput.clientHeight - lineHeight){
    npInput.scrollTop = Math.max(0, target - npInput.clientHeight / 2);
  }
}

function goToMatch(index){
  if(!npFindState.matches.length){ npFindState.currentIndex = -1; updateFindCount(); renderNotepad(); return; }
  npFindState.currentIndex = ((index % npFindState.matches.length) + npFindState.matches.length) % npFindState.matches.length;
  var match = npFindState.matches[npFindState.currentIndex];
  npInput.focus();
  npInput.setSelectionRange(match.start, match.end);
  scrollToSelection(match.start);
  updateFindCount();
  renderNotepad();
}

function refreshFind(keepIndexNear){
  npFindState.query = npFindInputEl.value;
  computeFindMatches();
  if(!npFindState.matches.length){
    npFindState.currentIndex = -1;
  } else if(typeof keepIndexNear === 'number'){
    // Find the first match at/after the given text position, wrapping to the first match.
    var idx = npFindState.matches.findIndex(function(m){ return m.start >= keepIndexNear; });
    npFindState.currentIndex = idx === -1 ? 0 : idx;
  } else if(npFindState.currentIndex === -1){
    npFindState.currentIndex = 0;
  } else if(npFindState.currentIndex >= npFindState.matches.length){
    npFindState.currentIndex = npFindState.matches.length - 1;
  }
  updateFindCount();
  if(npFindState.matches.length){
    var match = npFindState.matches[npFindState.currentIndex];
    npInput.setSelectionRange(match.start, match.end);
    scrollToSelection(match.start);
  }
  renderNotepad();
}

function buildExportText(){
  var lines = npInput.value.split('\n');
  var evalOut = evaluateNotepad(npInput.value);
  var results = evalOut.results;
  return lines.map(function(rawLine, i){
    var trimmedLine = rawLine.trim();
    if(!trimmedLine){ return rawLine; }

    var res = results[i] || '';
    var line = rawLine;
    if(res){
      var valueOnly = res.replace(/^=\s*/, '');
      var hasTrailingEq = /=\s*$/.test(trimmedLine);
      line += hasTrailingEq ? (' ' + valueOnly) : (' = ' + valueOnly);
    }

    var entry = npLineTimestamps[i];
    var isSettled = entry && entry.text === trimmedLine && npLastFinalizedText[i] === trimmedLine;
    if(isSettled){ line += ' (' + entry.ts + ')'; }
    return line;
  }).join('\n');
}

npImportFile.addEventListener('change', function(){
  var file = npImportFile.files && npImportFile.files[0];
  if(!file){ return; }
  var reader = new FileReader();
  var TS_SUFFIX_RE = /\s*\((\d{4}\/\d{2}\/\d{2}\/\d{2}:\d{2}:\d{2})\)\s*$/;
  var VALUE_SUFFIX_RE = /^(.*?)\s=\s(-?\d+(?:\.\d+)?)\s*$/;
  reader.onload = function(e){
    var rawLines = e.target.result.split('\n');
    var restoredTimestamps = [];
    var tsStrippedLines = rawLines.map(function(rawLine, i){
      var m = rawLine.match(TS_SUFFIX_RE);
      if(m){
        restoredTimestamps[i] = { ts: m[1] };
        return rawLine.slice(0, m.index);
      }
      restoredTimestamps[i] = null;
      return rawLine;
    });

    var finalLines = tsStrippedLines.slice();
    tsStrippedLines.forEach(function(line, i){
      var m = line.match(VALUE_SUFFIX_RE);
      if(!m){ return; }
      var candidate = m[1];
      var testLines = finalLines.slice(0, i).concat([candidate]);
      var testOut = evaluateNotepad(testLines.join('\n'));
      var testRes = testOut.results[i];
      if(testRes && parseFloat(testRes.replace(/^=\s*/, '')) === parseFloat(m[2])){
        finalLines[i] = candidate;
      }
    });

    finalLines.forEach(function(line, i){
      if(restoredTimestamps[i]){ restoredTimestamps[i].text = line.trim(); }
    });

    npInput.value = finalLines.join('\n');
    npLineTimestamps = restoredTimestamps;
    npLastFinalizedText = finalLines.map(function(l){ return l.trim(); });
    npFlashLines = {};
    renderNotepad();
    npScheduleTsSave();
    npSaveNow();
  };
  reader.readAsText(file);

});

// Toggling ON writes every CSV row as consecutive "Header = value" lines,
// appended to the current notepad text, and remembers where that block starts
// so the margin can draw a bracket + rotated "RowN" label per group. Toggling
// OFF removes exactly that many lines again. Editing lines inside the block by
// hand (adding/removing lines) will drift the bracket alignment, since it's
// tracked by line count, not by content.
var npRowViewActive = false;
var npRowViewMeta = null;
function buildRowViewText(){
  var lines = [];
  npCsvRows.forEach(function(row){
    npCsvHeaders.forEach(function(h){ lines.push(h + ' = ' + (row[h] || '')); });
  });

function renderRowBrackets(){

    npRowGutter.classList.remove('active');

  }
  npRowGutter.classList.add('active');

  var html = '';
  for(var r = 0; r < npRowViewMeta.rowCount; r++){
    var top = 18 + (npRowViewMeta.startLine + r * npRowViewMeta.colsPerRow) * lineHeight;
    var height = npRowViewMeta.colsPerRow * lineHeight;
    html += '<div class="np-row-bracket" style="top:' + top + 'px;height:' + height + 'px;"><span class="row-label">Row' + (r + 1) + '</span></div>';
  }
  npRowGutter.innerHTML = html;
  npRowGutter.scrollTop = npInput.scrollTop;
}

});

/* ---------------- Variable & CSV product-name autocomplete ---------------- */
var npKnownVars = [];
var npSuggestEl = document.getElementById('npSuggest');
var npVarMirrorEl = null;
// Each match is its own {name, start, end} so multi-word CSV names (e.g. "Ball
// Pen") and single-word variable names can be suggested side by side even
// though they're matched against different amounts of text before the caret.
var npSuggestState = { active: false, matches: [], highlightIndex: 0 };

function getWordBeforeCaret(value, pos){
  var start = pos;
  while(start > 0 && /[A-Za-z0-9_]/.test(value[start - 1])){ start--; }
  return { start: start, word: value.slice(start, pos) };
}
function getPhraseBeforeCaret(value, pos){
  // Like getWordBeforeCaret, but also allows single spaces so a multi-word
  // CSV product name ("Ball Pen") can be matched while it's still being typed.
  var start = pos;
  while(start > 0 && /[A-Za-z0-9_ ]/.test(value[start - 1])){ start--; }
  while(start < pos && value[start] === ' '){ start++; }
  return { start: start, phrase: value.slice(start, pos) };
}

function createVarMirror(){
  var div = document.createElement('div');
  var style = div.style;
  var computed = window.getComputedStyle(npInput);
  style.position = 'absolute'; style.visibility = 'hidden'; style.top = '0'; style.left = '-9999px'; style.whiteSpace = 'pre';
  ['fontFamily','fontSize','fontWeight','fontStyle','letterSpacing','lineHeight',
   'paddingTop','paddingRight','paddingBottom','paddingLeft',
   'borderTopWidth','borderRightWidth','borderBottomWidth','borderLeftWidth','boxSizing'
  ].forEach(function(prop){ style[prop] = computed[prop]; });
  document.body.appendChild(div);
  return div;
}
function getVarCaretCoords(position){
  if(!npVarMirrorEl){ npVarMirrorEl = createVarMirror(); }
  var value = npInput.value;
  npVarMirrorEl.textContent = value.substring(0, position);
  var span = document.createElement('span');
  span.textContent = value.substring(position) || '.';
  npVarMirrorEl.appendChild(span);
  return { top: span.offsetTop, left: span.offsetLeft };
}
function positionSuggestDropdownAt(pos){
  var rect = npInput.getBoundingClientRect();
  var caret = getVarCaretCoords(pos);
  var lineHeight = parseInt(window.getComputedStyle(npInput).lineHeight) || 26;
  var top = rect.top + caret.top + lineHeight - npInput.scrollTop;
  var left = rect.left + caret.left - npInput.scrollLeft;
  var maxLeft = window.innerWidth - 230;
  if(left > maxLeft){ left = maxLeft; } if(left < 8){ left = 8; }
  var maxTop = window.innerHeight - 40;
  if(top > maxTop){ top = rect.top + caret.top - npInput.scrollTop - 206; }
  npSuggestEl.style.top = top + 'px'; npSuggestEl.style.left = left + 'px';
}
function positionSuggestDropdown(){ positionSuggestDropdownAt(npInput.selectionStart); }

function renderSuggestList(){
  npSuggestEl.innerHTML = npSuggestState.matches.map(function(m, i){
    var cls = 'np-sugg-item' + (i === npSuggestState.highlightIndex ? ' active' : '');
    var fromCsv = Object.prototype.hasOwnProperty.call(npCsvPriceMap, m.name);
    var label = fromCsv ? (m.name + ' \u2014 ' + npCsvPriceMap[m.name]) : m.name;
    return '<div class="' + cls + '" data-idx="' + i + '">' + escapeHtml(label) + '</div>';
  }).join('');
  Array.prototype.forEach.call(npSuggestEl.querySelectorAll('.np-sugg-item'), function(el){
    el.addEventListener('mousedown', function(e){
      e.preventDefault();
      applySuggestion(parseInt(el.getAttribute('data-idx'), 10));
    });
  });
}
function showSuggestionMatches(matches, anchorPos){
  npSuggestState.active = true;
  npSuggestState.matches = matches; npSuggestState.highlightIndex = 0;
  renderSuggestList(); positionSuggestDropdownAt(anchorPos); npSuggestEl.style.display = 'block';
}
function hideSuggestions(){ npSuggestState.active = false; npSuggestEl.style.display = 'none'; }

function updateSuggestions(){
  var pos = npInput.selectionStart;
  if(pos !== npInput.selectionEnd){ hideSuggestions(); return; }
  var value = npInput.value;
  var results = [];
  var seen = {};

  var wordInfo = getWordBeforeCaret(value, pos);
  if(wordInfo.word.length >= 2){
    var lowerW = wordInfo.word.toLowerCase();
    var singleWordNames = npKnownVars.concat(Object.keys(npCsvPriceMap).filter(function(n){ return n.indexOf(' ') === -1; }));
    singleWordNames.forEach(function(name){
      var lname = name.toLowerCase();
      if(lname.indexOf(lowerW) === 0 && lname !== lowerW && !seen[lname]){
        seen[lname] = true;
        results.push({ name: name, start: wordInfo.start, end: pos });
      }
    });
  }

  var phraseInfo = getPhraseBeforeCaret(value, pos);
  if(phraseInfo.phrase.length >= 2){
    var lowerP = phraseInfo.phrase.toLowerCase();
    Object.keys(npCsvPriceMap).filter(function(n){ return n.indexOf(' ') !== -1; }).forEach(function(name){
      var lname = name.toLowerCase();
      if(lname.indexOf(lowerP) === 0 && lname !== lowerP && !seen[lname]){
        seen[lname] = true;
        results.push({ name: name, start: phraseInfo.start, end: pos });
      }
    });
  }

  results.sort(function(a, b){ return (a.end - a.start === b.end - b.start) ? 0 : (b.end - b.start) - (a.end - a.start); });
  results = results.slice(0, 8);
  if(results.length){ showSuggestionMatches(results, Math.min(wordInfo.start, phraseInfo.start)); }
  else { hideSuggestions(); }
}
function applySuggestion(index){
  var picked = npSuggestState.matches[index];
  if(!picked){ hideSuggestions(); return; }
  var value = npInput.value;
  var before = value.slice(0, picked.start);
  var after = value.slice(picked.end);
  var inserted = picked.name + ' ';
  npInput.value = before + inserted + after;
  var newPos = before.length + inserted.length;
  npInput.selectionStart = npInput.selectionEnd = newPos;
  hideSuggestions(); renderNotepad(); npScheduleSave(); npInput.focus();
}
document.addEventListener('click', function(e){
  if(e.target === npInput || npSuggestEl.contains(e.target)){ return; }
  hideSuggestions();
});
window.addEventListener('resize', function(){ if(npSuggestState.active){ positionSuggestDropdown(); } });

npInput.addEventListener('input', function(e){
  renderNotepad(); npScheduleSave(); scheduleFinalizeCheck(); updateSuggestions();
});
npInput.addEventListener('scroll', function(){
  npOverlay.scrollTop = npInput.scrollTop; npOverlay.scrollLeft = npInput.scrollLeft; npGutter.scrollTop = npInput.scrollTop;
  npRowGutter.scrollTop = npInput.scrollTop;
  if(npSuggestState.active){ positionSuggestDropdown(); }
});

// Handle a press (rather than waiting for click): active timer lines are redrawn
// frequently, and a click can otherwise finish on a button that no longer exists.
npOverlay.addEventListener('pointerdown', function(e){

npInput.addEventListener('keydown', function(e){
  if(npSuggestState.active){
    if(e.key === 'ArrowDown' && npSuggestState.matches.length){
      e.preventDefault();
      npSuggestState.highlightIndex = (npSuggestState.highlightIndex + 1) % npSuggestState.matches.length;
      renderSuggestList(); return;
    }
    if(e.key === 'ArrowUp' && npSuggestState.matches.length){
      e.preventDefault();
      npSuggestState.highlightIndex = (npSuggestState.highlightIndex - 1 + npSuggestState.matches.length) % npSuggestState.matches.length;
      renderSuggestList(); return;
    }
    if((e.key === 'Enter' || e.key === 'Tab') && npSuggestState.matches.length){
      e.preventDefault(); applySuggestion(npSuggestState.highlightIndex); return;
    }
    if(e.key === 'Escape'){ e.preventDefault(); hideSuggestions(); return; }
  }

  if(e.key !== 'Tab'){ return; }
  var value = npInput.value;
  var pos = npInput.selectionStart;
  var lineStart = value.lastIndexOf('\n', pos - 1) + 1;
  var lineEnd = value.indexOf('\n', pos);
  if(lineEnd === -1){ lineEnd = value.length; }
  var lineIndex = value.slice(0, lineStart).split('\n').length - 1;
  var evalOut = evaluateNotepad(value);
  var res = evalOut.results[lineIndex];
  if(!res){ return; }
  e.preventDefault();
  var rawLine = value.slice(lineStart, lineEnd);
  var trimmed = rawLine.trim();
  var hasTrailingEq = /=\s*$/.test(trimmed);
  var valueOnly = res.replace(/^=\s*/, '');
  var insertText = hasTrailingEq ? (' ' + valueOnly) : (' = ' + valueOnly);
  npInput.value = value.slice(0, lineEnd) + insertText + value.slice(lineEnd);
  var newPos = lineEnd + insertText.length;
  npInput.selectionStart = npInput.selectionEnd = newPos;
  renderNotepad(); npScheduleSave();
});

// A short beep using Web Audio API -- no external sound file needed, works offline.
function playAlarmBeep(){
  try{
    var Ctx = window.AudioContext || window.webkitAudioContext;
    var ctx = new Ctx();
    var playTone = function(delay){
      var osc = ctx.createOscillator();
      var gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = 880;
      gain.gain.setValueAtTime(0.0001, ctx.currentTime + delay);
      gain.gain.exponentialRampToValueAtTime(0.3, ctx.currentTime + delay + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + delay + 0.35);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(ctx.currentTime + delay);
      osc.stop(ctx.currentTime + delay + 0.4);
    };
    playTone(0); playTone(0.45); playTone(0.9);
  }catch(e){}
}

/* ---------------- Timers directly in notepad lines ----------------
   Write one of these on its own line:
     stopwatch
     countdown 5m       (also: timer 1:30, countdown 1h 20m)
     remind in 10m | Stretch
     remind 2026-08-12 14:30 | Call the client
     every 1d | L2 = L2 + L1     (recurring calc, writes result back into a line)
     at 2026-08-13 09:00 | L2 = L2 + L1
     after 1m every 1s | L3 = L3 + 2   (wait 1m, THEN repeat every 1s)

   Schedules for these in-line timers now persist across reloads/tabs (see
   NP_LINE_TIMER_KEY below), so an "every 1d" accumulator keeps its original
   countdown instead of resetting to "1 day from now" every time the page loads.

   The part after "|" accepts any expression the normal engine supports
   (any number of L# refs, sum/avg/min/max/count over a range, vars, units,
   dates, etc), and those refs can point to ANY line -- above or below the
   timer line itself. Chain several outputs in one timer by separating
   statements with ";":
     every 1d | L6 = L1 + L2 + L3 + L4 + L5
     every 1d | L7 = sum(L1 to L5); L8 = avg(L1 to L5); L2 = L2 + L7
*/
var NP_LINE_TIMER_KEY = 'notepad-calculator-fullpage-linetimers-v1';
var npLineTimers = {};
try{
  var storedLineTimers = localStorage.getItem(NP_LINE_TIMER_KEY);
  npLineTimers = storedLineTimers ? JSON.parse(storedLineTimers) : {};
}catch(e){ npLineTimers = {}; }
var npLineTimerSaveTimer = null;
function scheduleLineTimerSave(){
  clearTimeout(npLineTimerSaveTimer);
  npLineTimerSaveTimer = setTimeout(function(){
    try{ localStorage.setItem(NP_LINE_TIMER_KEY, JSON.stringify(npLineTimers)); }catch(e){}
  }, 300);
}
// Tracks which timer keys are still present on the current render pass, so
// entries for lines that were edited or deleted get pruned from storage
// instead of accumulating forever.
var npLineTimerSeenKeys = null;
function pruneLineTimers(){
  if(!npLineTimerSeenKeys){ return; }
  var changed = false;
  Object.keys(npLineTimers).forEach(function(key){
    if(!npLineTimerSeenKeys[key]){ delete npLineTimers[key]; changed = true; }
  });
  if(changed){ scheduleLineTimerSave(); }
}
var npLineTimerTick = null;
function parseLineDuration(text){
  var clock = text.match(/^(\d+):(\d{2})(?::(\d{2}))?$/);
  if(clock){ return ((clock[3] ? +clock[1] * 3600 + +clock[2] * 60 + +clock[3] : +clock[1] * 60 + +clock[2]) * 1000); }
  var total = 0, found = false, m;
  var re = /(\d+(?:\.\d+)?)\s*(h|hr|hrs|m|min|mins|s|sec|secs)\b/gi;

  return found ? Math.round(total) : 0;
}
function parseScheduleDuration(text){
  var total = 0, found = false, m;
  var re = /(\d+(?:\.\d+)?)\s*(years?|yrs?|y|months?|mos?|mo|weeks?|w|days?|d|hours?|hrs?|h|minutes?|mins?|min|m|seconds?|secs?|sec|s)\b/gi;
  var scale = { y:31557600000, yr:31557600000, yrs:31557600000, year:31557600000, years:31557600000, mo:2629800000, mos:2629800000, month:2629800000, months:2629800000, w:604800000, week:604800000, weeks:604800000, d:86400000, day:86400000, days:86400000, h:3600000, hr:3600000, hrs:3600000, hour:3600000, hours:3600000, m:60000, min:60000, mins:60000, minute:60000, minutes:60000, s:1000, sec:1000, secs:1000, second:1000, seconds:1000 };

}
function formatHMSMillis(totalMs){

function parseLineTimer(rawLine, index){
  var rawTrimmed = rawLine.trim();
  // Normalize "smart"/curly quotes to plain straight quotes before parsing.
  // macOS/iOS (Keyboard > "Use smart quotes") and pasting from Word/Pages/Notes
  // silently convert typed " into curly " " -- which would otherwise never
  // match the name/then-start parsing below, with no visible error.
  var line = rawTrimmed.replace(/[\u201C\u201D\u2033]/g, '"');

  // "then start "Name"" is a trailing completion trigger: when THIS timer
  // finishes, it starts a DIFFERENT, separately-declared timer whose own
  // quoted label matches "Name". Extracted first so it's never mistaken for
  // this timer's own label.
  var thenStart = '';
  var thenMatch = line.match(/\s+then\s+start\s+"([^"]*)"\s*$/i);
  if(thenMatch){
    thenStart = thenMatch[1].trim();
    line = line.slice(0, thenMatch.index).trim();
  }

  // "when CONDITION" (only meaningful on calc-type every/at/after timers, which
  // always end in "| expr") gates the timer behind a condition: it stays fully
  // dormant -- just like "manual" -- and only arms itself once CONDITION
  // evaluates truthy. CONDITION is any expression the normal engine supports,
  // so it can read another timer's output via the line it writes to (e.g.
  // "when L5 >= 100"), or a calendar/date comparison (e.g. "when today >=
  // 2026-09-01"), or both combined with && / ||. Implies "manual" automatically.
  var whenExpr = '';
  var whenMatch = line.match(/\s+when\s+(.+?)\s*(?=\|)/i);
  if(whenMatch){
    whenExpr = whenMatch[1].trim();
    line = (line.slice(0, whenMatch.index) + ' ' + line.slice(whenMatch.index + whenMatch[0].length)).replace(/\s{2,}/g, ' ').trim();
  }

  // "manual" marks a calc-type timer (every/at/after) as dormant -- it won't
  // auto-run on its own schedule until something (typically another timer's
  // "then start", or a "when" condition above) activates it. Has no effect on
  // stopwatch/countdown/reminder, which are already dormant until started/due
  // by design.
  var manual = !!whenExpr;
  var manualMatch = line.match(/(^|\s)manual(\s|$)/i);
  if(manualMatch){
    line = (line.slice(0, manualMatch.index) + ' ' + line.slice(manualMatch.index + manualMatch[0].length)).replace(/\s{2,}/g, ' ').trim();
    manual = true;
  }

  var label = '';
  var nameMatch = line.match(/"([^"]*)"/);
  if(nameMatch){
    label = nameMatch[1].trim();
    line = (line.slice(0, nameMatch.index) + line.slice(nameMatch.index + nameMatch[0].length)).replace(/\s{2,}/g, ' ').trim();
  }
  var match, type, duration = 0, when = 0, note = '';
  if(/^(?:sw|stopwatch)\b/i.test(line)){ type = 'sw'; }
  else if((match = line.match(/^(?:cd|countdown|timer)\s+(.+)$/i))){
    type = 'cd';
    var cdRest = match[1];
    var cdExpr = null;
    var pipeIdx = cdRest.indexOf('|');
    var cdDurationText = pipeIdx !== -1 ? cdRest.slice(0, pipeIdx) : cdRest;
    if(pipeIdx !== -1){ cdExpr = cdRest.slice(pipeIdx + 1).trim(); }
    duration = parseLineDuration(cdDurationText.trim());
    if(!duration){ return null; }
    return { type:type, key:type + ':' + rawTrimmed, duration:duration, when:when, note:note, expr:cdExpr, label:label, thenStart:thenStart, manual:manual };
  }
  else if((match = line.match(/^(?:remind|reminder)\s+(.+?)(?:\s*\|\s*(.*))?$/i))){
    type = 'rem'; note = (match[2] || '').trim(); var whenText = match[1].trim();
    var inMatch = whenText.match(/^in\s+(.+)$/i); when = inMatch ? Date.now() + parseLineDuration(inMatch[1]) : new Date(whenText).getTime();
    if(!when || isNaN(when)){ return null; }
  } else if((match = line.match(/^after\s+(.+?)\s+every\s+(.+?)\s*\|\s*(.+)$/i))){
    // Compound form: wait an initial delay, then repeat on a (usually shorter)
    // interval after that -- e.g. "after 1m every 1s | L3=L3+2".
    type = 'calc';
    var initialDelay = parseScheduleDuration(match[1].trim());
    var everyDuration = parseScheduleDuration(match[2].trim());
    if(!initialDelay || !everyDuration){ return null; }
    return { type:type, key:type + ':' + rawTrimmed, duration:everyDuration, initialDelay:initialDelay, mode:'every', expr:match[3].trim(), label:label, thenStart:thenStart, manual:manual, whenExpr:whenExpr };
  } else if((match = line.match(/^(every|after)\s+(.+?)\s*\|\s*(.+)$/i))){
    type = 'calc'; duration = parseScheduleDuration(match[2]);
    if(!duration){ return null; }
    return { type:type, key:type + ':' + rawTrimmed, duration:duration, mode:match[1].toLowerCase(), expr:match[3].trim(), label:label, thenStart:thenStart, manual:manual, whenExpr:whenExpr };
  } else if((match = line.match(/^(?:at|on)\s+(.+?)(?:\s*\|\s*(.+))?$/i))){
    type = 'calc'; when = new Date(match[1].trim()).getTime();
    if(!when || isNaN(when)){ return null; }
    return { type:type, key:type + ':' + rawTrimmed, when:when, mode:'at', expr:(match[2] || '').trim(), label:label, thenStart:thenStart, manual:manual, whenExpr:whenExpr };
  } else { return null; }
  return { type:type, key:type + ':' + rawTrimmed, duration:duration, when:when, note:note, label:label, thenStart:thenStart, manual:manual };
}
function triggerThenStart(name){
  if(!name){ return; }
  var found = false;
  Object.keys(npLineTimers).forEach(function(k){
    var t = npLineTimers[k];
    if(!t || t.label !== name){ return; }
    found = true;
    if(t.type === 'cd'){
